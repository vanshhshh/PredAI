      - key: AGENT_SIGNAL_ENDPOINTS
        value: https://predai-backend.onrender.com/signals/market-probability
      - key: AGENT_MIN_EDGE_BPS
        value: "500"
      - key: AGENT_MIN_CONFIDENCE_BPS
        value: "900"
      - key: AGENT_MAX_TRADE_WEI
        value: "0"
      - key: AGENT_MAX_MARKET_EXPOSURE_WEI
        value: "0"
      - key: AGENT_MAX_DAILY_EXPOSURE_WEI
        value: "0"
      - key: AGENT_MIN_SECONDS_TO_CLOSE
